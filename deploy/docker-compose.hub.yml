services:
  node-0:
    image: ravnest/ravnest:gpu-latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - RANK=0
      - WORLD_SIZE=2
      - MASTER_ADDR=node-0
      - MASTER_PORT=29500
      - MODEL_NAME=${MODEL_NAME:-meta-llama/Llama-3.2-3B}
      - NODE_ROLE=root
      - RAVNEST_API_KEY=${RAVNEST_API_KEY:-}
      - RAVNEST_PROPORTIONS=${RAVNEST_PROPORTIONS:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - model_cache:/app/model_cache
    ports:
      - "${PORT:-8000}:8000"
    command: python deploy/entrypoint.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  node-1:
    image: ravnest/ravnest:gpu-latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - RANK=1
      - WORLD_SIZE=2
      - MASTER_ADDR=node-0
      - MASTER_PORT=29500
      - MODEL_NAME=${MODEL_NAME:-meta-llama/Llama-3.2-3B}
      - NODE_ROLE=leaf
      - RAVNEST_PROPORTIONS=${RAVNEST_PROPORTIONS:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - model_cache:/app/model_cache
    command: python deploy/entrypoint.py
    depends_on:
      - node-0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model_cache:
