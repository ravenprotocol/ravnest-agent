version: "3.8"

services:
  node-0:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cpu
    environment:
      - RANK=0
      - WORLD_SIZE=2
      - MASTER_ADDR=node-0
      - MASTER_PORT=29500
      - MODEL_NAME=TinyLlama/TinyLlama-1.1B-Chat-v1.0
      - NODE_ROLE=root
      - RAVNEST_DEVICE=cpu
      - PYTHONUNBUFFERED=1
    volumes:
      - model_cache:/app/model_cache
    ports:
      - "8000:8000"
    command: python deploy/entrypoint.py

  node-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cpu
    environment:
      - RANK=1
      - WORLD_SIZE=2
      - MASTER_ADDR=node-0
      - MASTER_PORT=29500
      - MODEL_NAME=TinyLlama/TinyLlama-1.1B-Chat-v1.0
      - NODE_ROLE=leaf
      - RAVNEST_DEVICE=cpu
      - PYTHONUNBUFFERED=1
    volumes:
      - model_cache:/app/model_cache
    command: python deploy/entrypoint.py
    depends_on:
      - node-0

volumes:
  model_cache:
